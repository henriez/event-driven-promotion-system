services:
  rabbitmq-server:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres-promotion:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PROMO_DB_USER}
      POSTGRES_PASSWORD: ${PROMO_DB_PASS}
      POSTGRES_DB: db_promotion
    ports:
      - "5432:5432"
    volumes:
      - pgdata-promotion:/var/lib/postgresql/data

  postgres-ranking:
    image: postgres:16
    environment:
      POSTGRES_USER: ${RANKING_DB_USER}
      POSTGRES_PASSWORD: ${RANKING_DB_PASS}
      POSTGRES_DB: db_ranking
    ports:
      - "5433:5432"
    volumes:
      - pgdata-ranking:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_USER: ${NOTIF_DB_USER}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASS}
      POSTGRES_DB: db_notification
    ports:
      - "5434:5432"
    volumes:
      - pgdata-notification:/var/lib/postgresql/data

volumes:
  rabbitmq-data:
  pgdata-promotion:
  pgdata-ranking:
  pgdata-notification:
